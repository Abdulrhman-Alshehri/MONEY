<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Spending</title>
<style>
:root{color-scheme:dark;--page:#0d0d0d;--sheet:#1a1a19;--card:#1f1f1e;--fg:#f0efec;--fg2:#c3c2b7;--mut:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.1);--acc:#3987e5;--ctx:#6b6a65;--good:#0ca30c;--bad:#e66767;--warn:#fab219;--seg:#3a3a38}
@media (prefers-color-scheme:light){:root{color-scheme:light;--page:#f9f9f7;--sheet:#fcfcfb;--card:#efeee9;--fg:#0b0b0b;--fg2:#52514e;--mut:#6b6a65;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.1);--acc:#2a78d6;--ctx:#b0afa8;--good:#006300;--bad:#d03b3b;--seg:#ffffff}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:560px;background:var(--page);color:var(--fg);font:17px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 96px)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
p{margin:0}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:18px 0 20px}
h1{font-size:28px;font-weight:700;margin:0}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:20px;font-weight:600;margin:30px 0 6px}
.nav{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:20px;background:var(--card);display:grid;place-items:center}
.round:disabled{opacity:.35;cursor:default}
.label{color:var(--fg2)}
.mut{color:var(--mut)}
.link{color:var(--acc);font-size:17px;font-weight:400}
.hero{font-size:56px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:2px}
.hero small{font-size:20px;font-weight:500;color:var(--fg2);letter-spacing:0;margin-left:2px}
.delta{margin-top:10px;color:var(--fg2)}
.delta b{font-weight:600}.delta.good b{color:var(--good)}.delta.bad b{color:var(--bad)}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:15px;color:var(--fg2)}
.warn .ico{color:var(--warn);margin-top:1px}
.legend{display:flex;gap:16px;margin:24px 0 10px;font-size:15px;color:var(--fg2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart text{font-size:13px;font-variant-numeric:tabular-nums;fill:var(--mut)}
.chart .e1,.chart .e2{paint-order:stroke;stroke:var(--page);stroke-width:5px;stroke-linejoin:round}
.chart .e1{fill:var(--fg);font-weight:600}.chart .e2{fill:var(--fg2)}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:12px 14px;border-radius:14px;background:var(--card);font-size:15px}
.note .ico{color:var(--acc);margin-top:1px}
.note.tap{cursor:pointer}
.note .go{margin-left:auto;color:var(--mut)}
.keep{display:block;padding:10px 0 4px;color:var(--acc)}
.review-hint{margin:2px 0 4px;font-size:15px;color:var(--fg2)}
.review-hint+.tx,h2+.tx{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;column-gap:8px;row-gap:6px;align-items:center;width:100%;padding:9px 0}
.row .a{font-variant-numeric:tabular-nums}
.row .ico{width:14px;height:14px;color:var(--mut)}
.row .s{color:var(--fg2);font-size:15px;margin-left:4px}
.row .t{grid-column:1/-1;height:8px}
.row .t i{display:block;height:100%;min-width:3px;background:var(--acc);border-radius:0 4px 4px 0}
.row .t i.soft{opacity:.45}
.tx3{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;padding:11px 0;border-top:1px solid var(--grid)}
.tx3:first-child{border-top:0}
.tx3 .d{color:var(--fg2);font-size:15px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:baseline;width:100%;padding:10px 0;border-top:1px solid var(--grid)}
.tx .s{grid-column:1/-1;color:var(--fg2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-variant-numeric:tabular-nums;white-space:nowrap}
.a.in{font-weight:600}
.dim{opacity:.55}
.day{font-size:15px;font-weight:600;color:var(--fg2);margin:22px 0 2px}
.day+.tx{border-top:0}
.search{display:block;width:100%;padding:11px 14px;border:0;border-radius:12px;background:var(--card);font-size:17px;-webkit-appearance:none;appearance:none}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 12px;border-radius:99px;background:var(--card);font-size:15px}
.chip .ico{width:14px;height:14px}
.sum{color:var(--fg2);margin-top:14px}
.plan{margin-top:6px;color:var(--fg2)}
.plan b{color:var(--fg);font-weight:600}
.plan.bad b{color:var(--bad)}
.goal{display:block;width:100%;margin:0 0 26px;padding:16px;border-radius:16px;background:var(--card);text-align:left}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.goal .gv{margin-top:4px;font-size:34px;font-weight:600;letter-spacing:-.01em}
.goal .gv small{margin-left:6px;font-size:17px;font-weight:400;color:var(--fg2);letter-spacing:0}
.meter{height:10px;margin:12px 0 10px;border-radius:5px;background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.meter i{display:block;height:100%;min-width:4px;border-radius:5px;background:var(--acc)}
.goal .gs{font-size:15px;color:var(--fg2)}
.goal .gs b{color:var(--fg);font-weight:600}
.goal .gs.bad b{color:var(--bad)}
.goal.setup b{display:block;margin-bottom:4px}
#mUsual{margin-bottom:8px}
#mFixed .tx:first-child{border-top:0}
select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{display:block;padding:12px 16px;border-radius:12px;background:var(--card);text-align:center}
.btn.primary{background:var(--acc);color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:15px;margin-top:10px}
/* Tabs sit at the top: Netlify's free plan pins a badge over the bottom-right corner that can't be hidden */
nav.tabs{display:flex;gap:4px;margin-top:8px;padding:4px;border-radius:12px;background:var(--card)}
nav.tabs button{flex:1;padding:8px 0;border-radius:9px;text-align:center;font-size:15px;font-weight:500;color:var(--fg2)}
nav.tabs button[aria-current]{background:var(--seg);color:var(--fg);font-weight:600}
dialog{width:min(440px,calc(100vw - 24px));padding:20px;border:0;border-radius:20px;background:var(--sheet);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{font-size:22px;margin:0;overflow-wrap:anywhere}
dialog label{display:block;margin-top:16px;font-size:15px;color:var(--fg2)}
dialog select,dialog input[type=text]{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--ring);border-radius:12px;background:var(--page);font-size:17px}
dialog .chk{display:flex;gap:10px;align-items:center;font-size:17px;color:var(--fg)}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--acc)}
.hint{margin-top:8px;font-size:15px;color:var(--fg2)}
.acts{display:flex;gap:10px;margin-top:22px}
.acts .primary{flex:1}
.acts .danger{background:none;color:var(--bad);padding-left:0}
#login{max-width:380px;margin:60px auto 0}
#login p{color:var(--fg2);margin-top:8px}
#login input{display:block;width:100%;margin:16px 0 12px;padding:12px 14px;border:1px solid var(--ring);border-radius:12px;background:var(--sheet);font-size:17px}
#login .btn{width:100%}
#tt{position:fixed;z-index:20;display:none;pointer-events:none;max-width:240px;padding:7px 10px;border-radius:10px;background:var(--fg);color:var(--page);font-size:15px}
#tt b{display:block}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Spending</h1>
  <p>Enter your token. It's saved only on this phone.</p>
  <input id="tok" type="password" autocomplete="off" autocapitalize="off" aria-label="Token">
  <button class="btn primary" id="go">Open</button>
  <div class="err" id="err"></div>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" id="tHome">Home</button>
  <button data-tab="pay" id="tPay">Payments</button>
  <button data-tab="months" id="tMonths">Months</button>
</nav>

<main id="app" hidden>
  <section id="home">
    <div class="top">
      <h1 id="hMonth"></h1>
      <div class="nav"><button class="round" id="hPrev" aria-label="Previous month"></button><button class="round" id="hNext" aria-label="Next month"></button></div>
    </div>
    <div class="label">Spent</div>
    <div class="hero" id="hSpent"></div>
    <div class="delta" id="hDelta"></div>
    <div class="plan" id="hPlan" hidden></div>
    <div class="warn" id="hWarn" hidden></div>
    <div class="legend" id="hLegend"></div>
    <div class="chart" id="hPace"></div>
    <div class="note" id="hNote" hidden></div>
    <h2>Where it went</h2>
    <div id="hCats"></div>
    <h2><span id="hListT"></span><button class="link" id="hAll">See all</button></h2>
    <div id="hList"></div>
  </section>

  <section id="pay" hidden>
    <div class="top"><h1>Payments</h1><div class="nav"><button class="link" id="pReview" hidden></button><button class="link" id="pExport">Export</button></div></div>
    <input id="q" class="search" type="search" placeholder="Search" aria-label="Search payments" autocomplete="off">
    <div id="pChip"></div>
    <div class="sum" id="pSum"></div>
    <div id="pList"></div>
    <button class="btn" id="pMore" hidden style="width:100%;margin-top:14px">Show more</button>
  </section>

  <section id="months" hidden>
    <div class="top"><h1>Months</h1></div>
    <div id="mGoal"></div>
    <div class="label" id="mUsual"></div>
    <div id="mBars"></div>
    <div id="mHabits"></div>
    <h2>Every month</h2>
    <div class="label" id="mFixedSum"></div>
    <div id="mFixed"></div>
    <div id="mBalW"><h2>Balance</h2><div class="label" id="mBalD"></div><div class="chart" id="mBal" style="margin-top:12px"></div></div>
  </section>
</main>

<dialog id="dlg">
  <h3 id="dM"></h3>
  <div class="label" id="dS" style="margin-top:4px"></div>
  <label>Category<select id="dCat"></select></label>
  <div class="hint" id="dHint" hidden></div>
  <label id="dNewW" hidden>New category name<input id="dNew" type="text" maxlength="30"></label>
  <label class="chk" id="dAllW"><input id="dAll" type="checkbox"><span id="dAllT"></span></label>
  <label>Note<input id="dNote" type="text" maxlength="120"></label>
  <label class="chk"><input id="dEx" type="checkbox">Don't count this payment</label>
  <div class="err" id="dErr"></div>
  <div class="acts"><button class="btn danger" id="dDel">Delete</button><button class="btn" id="dCancel">Cancel</button><button class="btn primary" id="dSave">Save</button></div>
</dialog>
<dialog id="planDlg">
  <h3>Savings plan</h3>
  <div class="label" style="margin-top:4px">Kept only on this phone.</div>
  <label>Monthly salary<input id="pIncome" type="text" inputmode="decimal" autocomplete="off"></label>
  <label>Salary day<input id="pDay" type="text" inputmode="numeric" autocomplete="off"></label>
  <label>Save each month<input id="pAmt" type="text" inputmode="decimal" autocomplete="off"></label>
  <label>Savings goal<input id="pGoal" type="text" inputmode="decimal" autocomplete="off"></label>
  <label>First month<select id="pStart"></select></label>
  <div class="hint">Left to spend = salary − saving − spending − money sent to people.</div>
  <div class="err" id="pErr"></div>
  <div class="acts"><button class="btn danger" id="pDel">Remove</button><button class="btn" id="pCancel">Cancel</button><button class="btn primary" id="pOk">Save</button></div>
</dialog>
<div id="tt"></div>

<script>
const API = location.hostname === 'localhost' ? '/api' : 'https://itkbgyikekieqbxbbdad.supabase.co/functions/v1/sms-ingest';
const $ = id => document.getElementById(id);
const DEFAULT_CATS = ['Food & Cafes','Groceries','Transport','Fuel','Shopping','Bills & Telecom','Subscriptions','Rent & Housing','Entertainment','Travel','Health','Personal Care','Government','Wallets & Finance','Fees','Savings','Transfers','Income','Cash deposit','Uncategorized'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = m => MONTHS[m].slice(0, 3), DAY = d => DAYS[d].slice(0, 3);
const RIYADH = 3 * 36e5, DAY_MS = 864e5;
const INCOMING = ['refund', 'income', 'cash_in', 'transfer_in'];
const ICONS = {
  prev: '<path d="M15 5l-7 7 7 7"/>', next: '<path d="M9 5l7 7-7 7"/>', down: '<path d="M5 9l7 7 7-7"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
};
let data = [], tab = 'home', vy = 0, vm = 0, showAllCats = false, pFilter = null, shown = 60, cur = null, loadedAt = 0, fixedCache = null, dayCache = null, unusualCache = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('en', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const whole = n => Math.round(n).toLocaleString('en');
const amt = n => n < 10 && n % 1 ? n.toFixed(2) : whole(n); // whole riyals, except small amounts such as fees
const exact = n => n % 1 ? money(n) : whole(n); // to match an SMS, e.g. a possible duplicate
const icon = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const local = p => new Date(new Date(p.occurred_at || p.created_at).getTime() + RIYADH);
const today = () => new Date(Date.now() + RIYADH); // Riyadh "now"; read with getUTC*, like p._d
const dayNum = d => Math.floor(d.getTime() / DAY_MS);
const fromDayNum = n => new Date(n * DAY_MS);
const monthIdx = d => d.getUTCFullYear() * 12 + d.getUTCMonth();
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const inMonth = (p, y, m) => p._d.getUTCFullYear() === y && p._d.getUTCMonth() === m;
const monthName = (y, m) => MONTHS[m] + (y !== today().getUTCFullYear() ? ' ' + y : '');
const shortDate = d => `${d.getUTCDate()} ${MON(d.getUTCMonth())}`;
const hhmm = d => String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
const cityName = c => c ? c.charAt(0).toUpperCase() + c.slice(1).toLowerCase() : '';
const allCats = () => [...new Set([...DEFAULT_CATS, ...data.map(p => p.category)])];
const byId = id => data.find(p => String(p.id) === id);
const label = p => p.kind === 'transfer_out' ? p.category : (p.merchant || 'Unknown'); // rent reads as "Rent & Housing", not the landlord's name
const headers = () => ({'x-api-key': localStorage.getItem('tok') || ''});

// THE definition of spending. Purchases and fees add, refunds subtract. A transfer you send counts once
// you give it a category other than Transfers or Savings (rent, for example). Money received never counts.
function spend(p) {
  if (p.excluded) return 0;
  if (p.kind === 'purchase' || p.kind === 'fee') return p.amount;
  if (p.kind === 'refund') return -p.amount;
  if (p.kind === 'transfer_out' && p.category !== 'Transfers' && p.category !== 'Savings') return p.amount;
  return 0;
}

// The savings plan: personal numbers stay in this phone's storage, never in the repo or the database.
const PLAN_KEY = 'plan';
function getPlan() {
  try { const p = JSON.parse(localStorage.getItem(PLAN_KEY) || 'null'); return p && p.income > 0 && p.save > 0 && p.goal > 0 && Number.isFinite(p.start) ? p : null; } catch (e) { return null; }
}
const isSavings = p => !p.excluded && p.kind === 'transfer_out' && p.category === 'Savings';
const sentToPeople = p => !p.excluded && p.kind === 'transfer_out' && p.category === 'Transfers';
const outflow = p => spend(p) + (sentToPeople(p) ? p.amount : 0); // what leaves the month's money, apart from saving
const nameKey = m => (m || '').toLowerCase().replace(/\s+/g, ' ').trim();
const INCOMING_KINDS = ['transfer_in', 'income', 'cash_in'];
// "Use for all": the same merchant whatever the capitals or spacing; money received keeps its own category (as in index.ts)
const sameMerchantAs = (x, p) => x === p || (!!x.merchant && !!p.merchant && nameKey(x.merchant) === nameKey(p.merchant) && !INCOMING_KINDS.includes(x.kind));
// Money put into savings per month: transfers marked Savings, minus money sent back from those same accounts.
function savedByMonth() {
  const accounts = new Set(data.filter(isSavings).map(p => nameKey(p.merchant)).filter(Boolean)), m = new Map();
  data.forEach(p => {
    const v = isSavings(p) ? p.amount : !p.excluded && p.kind === 'transfer_in' && accounts.has(nameKey(p.merchant)) ? -p.amount : 0;
    if (v) m.set(monthIdx(p._d), (m.get(monthIdx(p._d)) || 0) + v);
  });
  return m;
}

async function load() {
  if (!localStorage.getItem('tok')) return showLogin('');
  try {
    const r = await fetch(API, {headers: headers()});
    if (r.status === 401) { localStorage.removeItem('tok'); return showLogin('Wrong token'); }
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    data.forEach(p => { p.amount = Number(p.amount || 0); p._d = local(p); });
    changed();
    if (!loadedAt) { const t = today(); vy = t.getUTCFullYear(); vm = t.getUTCMonth(); }
    loadedAt = Date.now();
    $('login').hidden = true; $('app').hidden = false; $('tabs').hidden = false;
    render();
  } catch (e) { if (!loadedAt) showLogin('Could not reach the server'); }
}
function showLogin(msg) { $('login').hidden = false; $('app').hidden = true; $('tabs').hidden = true; $('err').textContent = msg; }
const changed = () => { fixedCache = null; dayCache = null; unusualCache = null; };

function render() {
  for (const t of ['home', 'pay', 'months']) $(t).hidden = t !== tab;
  document.querySelectorAll('#tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (tab === 'home') renderHome(); else if (tab === 'pay') renderPay(); else renderMonths();
}

// ---------- shared helpers ----------
function totals(rows, key) {
  const m = new Map();
  rows.forEach(p => { const v = spend(p); if (v) m.set(key(p), (m.get(key(p)) || 0) + v); });
  return [...m].map(([k, v]) => ({k, v})).filter(e => e.v > 0.5).sort((a, b) => b.v - a.v);
}
function cumulative(rows, n) {
  const a = Array(n).fill(0);
  rows.forEach(p => { const d = p._d.getUTCDate(); if (d <= n) a[d - 1] += spend(p); });
  let s = 0; return a.map(v => s += v);
}
const firstMonth = () => data.length ? Math.min(...data.map(p => monthIdx(p._d))) : monthIdx(today());
const days = () => dayCache ||= [...new Set(data.map(p => dayNum(p._d)))].sort((a, b) => a - b);
// Runs of 5+ days with no payments at all inside [from, to] (day numbers): totals there are incomplete.
function gaps(from, to) {
  const d = days(); if (d.length) from = Math.max(from, d[0]);
  const pts = [from - 1, ...d.filter(x => x >= from && x <= to), to + 1], out = [];
  for (let i = 1; i < pts.length; i++) if (pts[i] - pts[i - 1] > 5) out.push([pts[i - 1] + 1, pts[i] - 1]);
  return out;
}
const range = ([a, b]) => a === b ? shortDate(fromDayNum(a)) : `${shortDate(fromDayNum(a))}–${shortDate(fromDayNum(b))}`;
function partial(m) {
  const y = Math.floor(m / 12), mo = m % 12, start = dayNum(new Date(Date.UTC(y, mo, 1))), end = Math.min(dayNum(new Date(Date.UTC(y, mo, daysIn(y, mo)))), dayNum(today()));
  const d = days();
  return (d.length && d[0] - start >= 5 && d[0] <= end) || gaps(start, end).length > 0;
}
function dayLabel(d, long) {
  const t = today(), ago = dayNum(t) - dayNum(d);
  if (ago === 0) return 'Today';
  if (ago === 1) return 'Yesterday';
  if (!long && ago > 1 && ago < 7) return DAY(d.getUTCDay());
  const s = shortDate(d) + (d.getUTCFullYear() !== t.getUTCFullYear() ? ' ' + d.getUTCFullYear() : '');
  return long ? `${DAYS[d.getUTCDay()]} ${s}` : s;
}
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');

// Same merchant and amount about once a month, on about the same day: subscriptions, bills, rent.
const EVERYDAY = ['Food & Cafes', 'Groceries', 'Transport', 'Shopping', 'Fuel']; // the same coffee a month apart isn't a fixed cost
const fixedKey = p => (p.merchant || '').toLowerCase().trim() + '|' + p.amount.toFixed(2);
function fixedCosts() {
  if (fixedCache) return fixedCache;
  const now = monthIdx(today()), groups = new Map();
  data.forEach(p => { if (spend(p) > 0 && p.kind !== 'fee' && p.merchant && !EVERYDAY.includes(p.category)) { const k = fixedKey(p); (groups.get(k) || groups.set(k, []).get(k)).push(p); } });
  const out = [];
  groups.forEach(list => {
    const perMonth = new Map();
    list.forEach(p => perMonth.set(monthIdx(p._d), (perMonth.get(monthIdx(p._d)) || 0) + 1));
    if ([...perMonth.values()].some(n => n > 1)) return;
    if ([1, 2, 3].filter(k => perMonth.has(now - k)).length < 2) return;
    const ds = list.filter(p => monthIdx(p._d) >= now - 3).map(p => p._d.getUTCDate()).sort((a, b) => a - b);
    if (ds[ds.length - 1] - ds[0] > 5) return;
    out.push({p: list.reduce((a, b) => b._d > a._d ? b : a), day: ds[Math.floor(ds.length / 2)], paid: perMonth.has(now)});
  });
  return fixedCache = out.sort((a, b) => b.p.amount - a.p.amount);
}

// ---------- Home ----------
function renderHome() {
  const t = today(), isNow = vy === t.getUTCFullYear() && vm === t.getUTCMonth();
  const upto = isNow ? t.getUTCDate() : daysIn(vy, vm);
  const py = vm ? vy : vy - 1, pm = vm ? vm - 1 : 11;
  const rows = data.filter(p => inMonth(p, vy, vm) && p._d.getUTCDate() <= upto);
  const prev = data.filter(p => inMonth(p, py, pm));
  const curCum = cumulative(rows, upto), prevCum = prev.length ? cumulative(prev, daysIn(py, pm)) : [];
  const total = curCum[upto - 1] || 0;

  $('hMonth').textContent = monthName(vy, vm);
  $('hPrev').disabled = vy * 12 + vm <= firstMonth();
  $('hNext').disabled = vy * 12 + vm >= monthIdx(t);
  $('hSpent').innerHTML = `${whole(total)}<small> SAR</small>`;

  // Missing data is reported next to the total it affects.
  const dn = (y, m, dd) => dayNum(new Date(Date.UTC(y, m, dd)));
  const last = days().length ? days()[days().length - 1] : dayNum(t);
  const stale = isNow && data.length > 0 && dayNum(t) - last >= 3;
  const end = isNow ? Math.min(dn(vy, vm, upto), last) : dn(vy, vm, upto);
  const g = gaps(dn(py, pm, 1), end);
  const warn = stale ? `Last payment was ${DAY(fromDayNum(last).getUTCDay())} ${shortDate(fromDayNum(last))}. Is the SMS Shortcut still on?`
    : g.length ? 'No data ' + g.slice(0, 2).map(range).join(', ') + (g.length > 2 ? ' and more' : '') : '';
  $('hWarn').hidden = !warn; $('hWarn').innerHTML = icon('warn') + `<span>${esc(warn)}</span>`;

  // Compared with the month before, up to the same day. Small differences aren't news, and there's
  // no verdict when either side is missing days: less spending and missing SMS look the same.
  const d = $('hDelta'); d.className = 'delta'; d.textContent = '';
  if (prevCum.length) {
    const n = isNow ? Math.min(upto, prevCum.length) : prevCum.length, same = prevCum[n - 1], diff = total - same;
    const period = n < prevCum.length ? `1–${n} ${MON(pm)}` : MONTHS[pm];
    const missing = stale || gaps(dn(py, pm, 1), dn(py, pm, n)).length > 0 || gaps(dn(vy, vm, 1), end).length > 0;
    if (missing) d.textContent = '';
    else if (Math.abs(diff) < Math.max(100, same * 0.05)) d.innerHTML = `About the same as ${period} <span class="mut">(${whole(same)})</span>`;
    else { const more = diff > 0; d.classList.add(more ? 'bad' : 'good'); d.innerHTML = `<b>${more ? '▲' : '▼'} ${whole(Math.abs(diff))} ${more ? 'more' : 'less'}</b> than ${period}`; }
  }

  planLine(rows, isNow, upto);
  $('hLegend').innerHTML = `<span><i style="background:var(--acc)"></i>${MONTHS[vm]}</span>` + (prevCum.length ? `<span><i style="background:var(--ctx)"></i>${MONTHS[pm]}</span>` : '');
  paceChart(curCum, prevCum, Math.max(daysIn(vy, vm), prevCum.length), pm);

  const note = isNow ? saveReminder(rows) || reviewNote() || forecast(rows, upto) || subsNote() || unusualNote() || overUsual(rows, upto) || dueSoon(upto) : '';
  const nt = typeof note === 'string' ? {text: note} : note, hn = $('hNote');
  hn.hidden = !nt.text; hn.innerHTML = icon('info') + `<span>${esc(nt.text || '')}</span>` + (nt.go ? icon('next').replace('class="ico"', 'class="ico go"') : '');
  hn.dataset.go = nt.go || ''; hn.classList.toggle('tap', !!nt.go);
  if (nt.go) { hn.setAttribute('role', 'button'); hn.tabIndex = 0; } else { hn.removeAttribute('role'); hn.removeAttribute('tabindex'); }

  const cats = totals(rows, p => p.category);
  const list = showAllCats || cats.length <= 5 ? cats : [...cats.slice(0, 4), {k: 'Other', v: cats.slice(4).reduce((s, e) => s + e.v, 0), more: cats.length - 4}];
  const max = Math.max(...list.map(e => e.v), 1);
  $('hCats').innerHTML = list.map(e => `<button class="row" ${e.more ? 'data-other="1"' : `data-cat="${esc(e.k)}"`}><span class="m">${esc(e.k)}${e.more ? ` <span class="s">${e.more} more</span>` : ''}</span><span class="a">${whole(e.v)}</span>${icon(e.more ? 'down' : 'next')}<span class="t"><i style="width:${(e.v / max * 100).toFixed(1)}%"></i></span></button>`).join('') || '<p class="label">No spending yet</p>';

  const pays = isNow ? data.filter(p => !p.excluded).sort((a, b) => b._d - a._d).slice(0, 5) : rows.filter(p => spend(p) > 0).sort((a, b) => b.amount - a.amount).slice(0, 5);
  $('hListT').textContent = isNow ? 'Latest' : 'Biggest';
  $('hList').innerHTML = pays.map(p => { const inc = INCOMING.includes(p.kind); return `<button class="tx3" data-id="${esc(p.id)}"><span class="d">${dayLabel(p._d)}</span><span class="m">${esc(p.merchant || 'Unknown')}</span><span class="a${inc ? ' in' : ''}">${inc ? '+' : ''}${amt(p.amount)}</span></button>`; }).join('') || '<p class="label">No payments yet</p>';
}

// A category far above its usual pace: the average of the last 3 months by the same day, leaving out fixed costs.
function overUsual(rows, upto) {
  const fixed = new Set(fixedCosts().map(f => fixedKey(f.p)));
  const byCat = list => { const m = new Map(); list.forEach(p => { if (p._d.getUTCDate() > upto || fixed.has(fixedKey(p))) return; const v = spend(p); if (v) m.set(p.category, (m.get(p.category) || 0) + v); }); return m; };
  const usual = new Map(); let n = 0;
  for (let k = 1; k <= 3; k++) {
    const t = new Date(Date.UTC(vy, vm - k, 1)), list = data.filter(p => inMonth(p, t.getUTCFullYear(), t.getUTCMonth()));
    if (!list.length) continue;
    n++; byCat(list).forEach((v, c) => usual.set(c, (usual.get(c) || 0) + v));
  }
  if (!n) return '';
  let best = null;
  byCat(rows).forEach((v, c) => { const u = (usual.get(c) || 0) / n; if (c !== 'Uncategorized' && v - u >= 150 && v >= u * 1.5 && (!best || v - u > best.x)) best = {c, v, u, x: v - u}; });
  return best ? `${best.c}: ${whole(best.v)} so far. Usually ${whole(best.u)} by now.` : '';
}
// Under the total: what's left of the month's money after saving, or how a past month ended against the plan.
function planLine(rows, isNow, upto) {
  const plan = getPlan(), el = $('hPlan');
  el.hidden = !plan || vy * 12 + vm < plan.start;
  if (el.hidden) return;
  const left = plan.income - plan.save - rows.reduce((s, p) => s + outflow(p), 0), days = daysIn(vy, vm) - upto + 1;
  el.className = 'plan' + (left < 0 ? ' bad' : '');
  el.innerHTML = left < 0 ? `<b>${whole(-left)} over plan</b>` : isNow ? `<b>${whole(left)}</b> left · ${whole(left / days)} a day for ${days} day${days === 1 ? '' : 's'}` : `<b>${whole(left)}</b> under plan`;
}
// Once the salary is in, a nudge until this month's saving has been moved.
function saveReminder(rows) {
  const plan = getPlan();
  if (!plan || vy * 12 + vm < plan.start || !rows.some(p => !p.excluded && p.kind === 'income' && p.amount >= plan.income / 2)) return '';
  const moved = rows.filter(isSavings).reduce((s, p) => s + p.amount, 0);
  return moved < plan.save - 1 ? `Salary is in. Move ${whole(plan.save - moved)} to savings.` : '';
}
// From day 5: if spending carries on at this pace, what would be left to save at the end of the month.
function forecast(rows, upto) {
  const plan = getPlan();
  if (!plan || vy * 12 + vm < plan.start || upto < 5) return '';
  const fixed = fixedCosts(), keys = new Set(fixed.map(f => fixedKey(f.p)));
  let soFar = 0, everyday = 0;
  rows.forEach(p => { const v = outflow(p); soFar += v; if (!keys.has(fixedKey(p))) everyday += v; });
  const later = fixed.filter(f => !f.paid && f.day > upto).reduce((s, f) => s + f.p.amount, 0);
  const canSave = Math.round((plan.income - soFar - everyday / upto * (daysIn(vy, vm) - upto) - later) / 50) * 50;
  if (canSave >= plan.save - 100) return '';
  return canSave < 50 ? 'At this pace nothing will be left to save this month.' : `At this pace you can save about ${whole(canSave)} this month, not ${whole(plan.save)}.`;
}
// ---------- review: duplicates, unrecognised SMS, uncategorized ----------
const DUP_KEY = 'dupOk'; // pairs you said are both real, remembered on this phone
function dupOk() { try { return new Set(JSON.parse(localStorage.getItem(DUP_KEY) || '[]')); } catch (e) { return new Set(); } }
// Same merchant, amount and kind from SMS within 2 minutes: usually the Shortcut running twice.
function duplicatePairs() {
  const ok = dupOk(), rows = data.filter(p => p.source === 'sms' && !p.excluded && p.amount > 0).sort((a, b) => a._d - b._d), out = [];
  for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length && rows[j]._d - rows[i]._d <= 120000; j++) {
    const a = rows[i], b = rows[j];
    if (a.kind === b.kind && Math.abs(a.amount - b.amount) < 0.005 && nameKey(a.merchant) === nameKey(b.merchant) && !ok.has(a.id + '|' + b.id)) out.push([a, b]);
  }
  return out;
}
function reviewItems() {
  const dups = duplicatePairs();
  const unknown = data.filter(p => p.kind === 'unknown' && p.category === 'Uncategorized').sort((a, b) => b._d - a._d);
  const uncat = data.filter(p => p.kind !== 'unknown' && p.category === 'Uncategorized' && spend(p) > 0).sort((a, b) => b._d - a._d);
  return {dups, unknown, uncat, count: dups.length + unknown.length + uncat.length};
}
// Only recent duplicates and unrecognised SMS earn the Home heads-up; older ones wait in Review.
function reviewNote() {
  const r = reviewItems(), since = Date.now() + RIYADH - 7 * DAY_MS;
  const d = r.dups.filter(([a]) => a._d.getTime() >= since), u = r.unknown.filter(p => p._d.getTime() >= since), n = d.length + u.length;
  if (d.length === 1 && !u.length) return {text: `Possible duplicate: ${d[0][0].merchant || 'Unknown'} ${exact(d[0][0].amount)} twice. Tap to check.`, go: 'review'};
  return n ? {text: `${n} payment${n === 1 ? '' : 's'} to check. Tap to review.`, go: 'review'} : '';
}
function openReview() { pFilter = {review: true}; $('q').value = ''; tab = 'pay'; render(); scrollTo(0, 0); }

// A purchase far above your normal at that place: at least 3 earlier ones there, 3 times their median, and 100 or more.
function unusual() {
  if (unusualCache) return unusualCache;
  const by = new Map(), out = new Map();
  data.filter(p => p.kind === 'purchase' && !p.excluded && p.merchant).sort((a, b) => a._d - b._d).forEach(p => { const k = nameKey(p.merchant); (by.get(k) || by.set(k, []).get(k)).push(p); });
  by.forEach(list => list.forEach((p, i) => {
    if (i < 3 || p.amount < 100) return;
    const prev = list.slice(0, i).map(x => x.amount).sort((a, b) => a - b), med = prev[Math.floor(prev.length / 2)];
    if (p.amount >= med * 3) out.set(p.id, med);
  }));
  return unusualCache = out;
}
function unusualNote() {
  const u = unusual(), since = Date.now() + RIYADH - 3 * DAY_MS;
  const p = data.filter(x => u.has(x.id) && x._d.getTime() >= since).sort((a, b) => b._d - a._d)[0];
  return p ? `${p.merchant} ${amt(p.amount)} is much more than usual there (usually ${amt(u.get(p.id))}).` : '';
}

// This month: fixed costs charged a different amount around their usual day, and subscriptions never seen before.
function subsChanges() {
  const now = monthIdx(today()), month = data.filter(p => monthIdx(p._d) === now && spend(p) > 0), out = [];
  fixedCosts().forEach(f => {
    if (f.paid) return;
    const k = nameKey(f.p.merchant);
    const p = month.find(x => nameKey(x.merchant) === k && Math.abs(x.amount - f.p.amount) >= 0.5 && x.amount > f.p.amount / 2 && x.amount < f.p.amount * 2 && Math.abs(x._d.getUTCDate() - f.day) <= 5);
    if (p) out.push({p, was: f.p.amount});
  });
  month.filter(p => p.category === 'Subscriptions' && p.merchant).forEach(p => {
    const k = nameKey(p.merchant);
    if (!out.some(o => o.p === p) && !data.some(x => monthIdx(x._d) < now && nameKey(x.merchant) === k)) out.push({p, isNew: true});
  });
  return out;
}
function subsNote() {
  const c = subsChanges()[0];
  return !c ? '' : c.isNew ? `New subscription: ${c.p.merchant} ${amt(c.p.amount)}.` : `${c.p.merchant} went from ${amt(c.was)} to ${amt(c.p.amount)}.`;
}

// Day-to-day spending, leaving out fixed costs (rent, bills, subscriptions), and only days with data.
function habits() {
  const t = today(), td = dayNum(t), fixed = new Set(fixedCosts().map(f => fixedKey(f.p)));
  const everyday = p => fixed.has(fixedKey(p)) ? 0 : spend(p), perDay = new Map();
  data.forEach(p => { const n = dayNum(p._d); if (n >= td - 56 && n <= td) perDay.set(n, (perDay.get(n) || 0) + everyday(p)); });
  const ds = days(), lastData = ds.length ? ds[ds.length - 1] : td, missing = new Set();
  gaps(td - 56, Math.min(td, lastData)).forEach(([a, b]) => { for (let n = a; n <= b; n++) missing.add(n); });
  const first = dayNum(new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1)));
  let free = 0, counted = 0, run = 0, best = 0;
  for (let n = first; n <= Math.min(td, lastData); n++) { if (missing.has(n)) { run = 0; continue; } counted++; if ((perDay.get(n) || 0) <= 0) { free++; best = Math.max(best, ++run); } else run = 0; }
  let we = 0, weN = 0, wd = 0, wdN = 0;
  for (let n = td - 56; n < Math.min(td, lastData + 1); n++) {
    if (missing.has(n) || (ds.length && n < ds[0])) continue;
    const v = perDay.get(n) || 0, dow = fromDayNum(n).getUTCDay();
    if (dow === 5 || dow === 6) { we += v; weN++; } else { wd += v; wdN++; }
  }
  return {free, counted, best, weekend: weN >= 4 ? we / weN : null, weekday: wdN >= 10 ? wd / wdN : null};
}
// Small purchases made often: under 50, at least 6 at one place in the last 30 days.
function smallLeaks() {
  const since = Date.now() + RIYADH - 30 * DAY_MS, m = new Map();
  data.forEach(p => {
    if (p.kind !== 'purchase' || p.excluded || p.amount >= 50 || p._d.getTime() < since || !p.merchant) return;
    const k = nameKey(p.merchant), e = m.get(k) || {name: p.merchant, n: 0, v: 0}; e.n++; e.v += p.amount; m.set(k, e);
  });
  return [...m.values()].filter(e => e.n >= 6).sort((a, b) => b.v - a.v).slice(0, 3);
}
function renderHabits() {
  const h = habits(), leaks = smallLeaks();
  let s = '';
  if (h.counted) s += `<div class="tx"><span class="m">No-spend days</span><span class="a">${h.free} of ${h.counted}</span><span class="s">This month${h.best > 1 ? ` · best streak ${h.best} days` : ''} · rent and bills don't count</span></div>`;
  if (h.weekend != null && h.weekday != null) s += `<div class="tx"><span class="m">Fri–Sat</span><span class="a">${whole(h.weekend)} a day</span><span class="s">Other days ${whole(h.weekday)} a day · last 8 weeks</span></div>`;
  s += leaks.map(e => `<button class="tx" data-q="${esc(e.name)}"><span class="m">${esc(e.name)}</span><span class="a">${whole(e.v)}</span><span class="s">${e.n} times in 30 days · ${whole(e.v * 12)} a year</span></button>`).join('');
  $('mHabits').innerHTML = s ? '<h2>Habits</h2>' + s : '';
}

// ---------- export ----------
async function exportCsv() {
  const cell = v => { let t = String(v ?? ''); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; }; // a leading = + - @ would run as a formula in Excel
  const lines = data.slice().sort((a, b) => a._d - b._d).map(p => [p._d.toISOString().slice(0, 10), hhmm(p._d), p.merchant, p.amount.toFixed(2), p.kind, p.category, spend(p) ? 'yes' : 'no', p.note, p.source].map(cell).join(','));
  const csv = String.fromCharCode(0xfeff) + ['Date,Time,Merchant,Amount SAR,Kind,Category,Counted as spending,Note,Source', ...lines].join('\r\n');
  const name = `spending-${today().toISOString().slice(0, 10)}.csv`, file = new File([csv], name, {type: 'text/csv'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: name}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function dueSoon(upto) {
  const dim = daysIn(vy, vm), due = fixedCosts().filter(f => { const ahead = f.paid ? dim - upto + f.day : f.day - upto; return ahead >= 1 && ahead <= 7; });
  return due.length ? 'Due this week: ' + due.slice(0, 3).map(f => `${label(f.p)} ${amt(f.p.amount)}`).join(', ') : '';
}

function paceChart(curCum, prevCum, n, pm) {
  const box = $('hPace');
  if (!curCum.some(v => v) && !prevCum.length) { box.innerHTML = ''; $('hLegend').innerHTML = ''; return; }
  const W = Math.max(box.clientWidth, 280), H = 150, T = 16, B = 24, R = 50;
  const top = niceMax(Math.max(1, ...curCum, ...prevCum));
  const X = d => (d - 1) / (n - 1) * (W - R), Y = v => T + (H - T - B) * (1 - Math.max(v, 0) / top);
  const path = a => a.map((v, i) => (i ? 'L' : 'M') + X(i + 1).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by day: ${whole(curCum[curCum.length - 1] || 0)} this month${prevCum.length ? `, ${whole(prevCum[Math.min(curCum.length, prevCum.length) - 1])} by the same day last month` : ''}">`;
  s += `<line x1="0" x2="${W - R}" y1="${Y(top)}" y2="${Y(top)}" stroke="var(--grid)"/><text x="0" y="${Y(top) - 5}">${whole(top)}</text>`;
  s += `<line x1="0" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  [1, 15, n].forEach((d, i) => { s += `<text x="${X(d)}" y="${H - 5}" text-anchor="${['start', 'middle', 'end'][i]}">${d}</text>`; });
  if (prevCum.length) s += `<path d="${path(prevCum)}" fill="none" stroke="var(--ctx)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text class="e2" x="${X(prevCum.length) + 6}" y="${Y(prevCum[prevCum.length - 1]) + 4}">${whole(prevCum[prevCum.length - 1])}</text>`;
  const cx = X(curCum.length), cy = Y(curCum[curCum.length - 1]);
  s += `<path d="${path(curCum)}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="4" fill="var(--acc)" stroke="var(--page)" stroke-width="2"/>`;
  const flip = cx > (W - R) * 0.6; // late in the month the label goes left of the dot, clear of last month's end label
  s += `<text class="e1" x="${flip ? cx - 9 : cx + 9}" y="${cy - 8}"${flip ? ' text-anchor="end"' : ''}>${whole(curCum[curCum.length - 1])}</text><line id="hx" y1="${T}" y2="${H - B}" stroke="var(--axis)" visibility="hidden"/></svg>`;
  box.innerHTML = s;
  const svg = box.querySelector('svg'), hx = svg.querySelector('#hx');
  svg.onpointermove = svg.onpointerdown = ev => {
    const r = svg.getBoundingClientRect(), d = Math.max(1, Math.min(n, Math.round((ev.clientX - r.left) / r.width * W / (W - R) * (n - 1)) + 1));
    const lines = [];
    if (d <= curCum.length) lines.push(`${d} ${MON(vm)}: ${whole(curCum[d - 1])}`);
    if (d <= prevCum.length) lines.push(`${d} ${MON(pm)}: ${whole(prevCum[d - 1])}`);
    if (!lines.length) return hideTip();
    hx.setAttribute('x1', X(d)); hx.setAttribute('x2', X(d)); hx.setAttribute('visibility', 'visible');
    showTip(ev, lines);
  };
  svg.onpointerleave = () => { hx.setAttribute('visibility', 'hidden'); hideTip(); };
}

// ---------- Payments ----------
function renderPay() {
  const r = reviewItems(), reviewing = !!(pFilter && pFilter.review);
  $('pReview').hidden = !r.count || reviewing; $('pReview').textContent = `Review ${r.count}`;
  if (reviewing) return renderReview(r);
  const q = $('q').value.trim().toLowerCase();
  let rows = data;
  if (pFilter) rows = rows.filter(p => inMonth(p, pFilter.y, pFilter.m) && (!pFilter.cat || p.category === pFilter.cat));
  if (q) rows = rows.filter(p => `${p.merchant || ''} ${p.category} ${p.note || ''} ${p.amount.toFixed(2)}`.toLowerCase().includes(q));
  rows = rows.slice().sort((a, b) => b._d - a._d);
  $('pChip').innerHTML = pFilter ? `<button class="chip" id="pClear" aria-label="Clear filter">${esc((pFilter.cat ? pFilter.cat + ' · ' : '') + monthName(pFilter.y, pFilter.m))}${icon('x')}</button>` : '';
  const total = rows.reduce((s, p) => s + spend(p), 0);
  $('pSum').textContent = pFilter || q ? `${rows.length} payment${rows.length === 1 ? '' : 's'} · ${whole(total)} SAR spent` : '';
  let html = '', lastDay = null;
  rows.slice(0, shown).forEach(p => {
    const k = dayNum(p._d);
    if (k !== lastDay) { html += `<div class="day">${dayLabel(p._d, true)}</div>`; lastDay = k; }
    html += txRow(p);
  });
  $('pList').innerHTML = html || '<p class="label" style="margin-top:20px">Nothing found</p>';
  $('pMore').hidden = rows.length <= shown;
}
function renderReview(r) {
  $('pChip').innerHTML = `<button class="chip" id="pClear" aria-label="Close review">To review${icon('x')}</button>`;
  $('pSum').textContent = r.count ? `${r.count} to check` : '';
  let h = '';
  if (r.dups.length) h += '<div class="day">Possible duplicates</div><p class="review-hint">Same place, same amount, 2 minutes apart. Delete one if you only paid once.</p>' + r.dups.map(([a, b]) => txRow(a) + txRow(b) + `<button class="keep" data-pair="${esc(a.id + '|' + b.id)}">Both are real</button>`).join('');
  if (r.unknown.length) h += '<div class="day">Not recognised</div><p class="review-hint">Usually promotions: delete them. If a real payment is here, tell me so its SMS format can be added.</p>' + r.unknown.map(txRow).join('');
  if (r.uncat.length) h += '<div class="day">Uncategorized</div><p class="review-hint">Pick a category. "Use for all" fixes the others from the same place.</p>' + r.uncat.slice(0, 100).map(txRow).join('');
  $('pList').innerHTML = h || '<p class="label" style="margin-top:20px">Nothing to check.</p>';
  $('pMore').hidden = true;
}
function txRow(p) {
  const inc = INCOMING.includes(p.kind);
  const sub = p.excluded ? (p.kind === 'unknown' ? 'Not recognised, not counted' : `${p.category}, not counted`) : p.kind === 'transfer_out' && p.category === 'Transfers' ? 'Transfer, not counted' : p.category;
  const u = unusual().get(p.id);
  return `<button class="tx${p.excluded ? ' dim' : ''}" data-id="${esc(p.id)}"><span class="m">${esc(p.merchant || 'Unknown')}</span><span class="a${inc ? ' in' : ''}">${inc ? '+' : ''}${amt(p.amount)}</span><span class="s">${esc(sub)}${u ? ` · usually ${amt(u)} here` : ''}${p.note ? ' · ' + esc(p.note) : ''}</span></button>`;
}
function openPayments(filter, q = '') {
  pFilter = filter; $('q').value = q; shown = 60; tab = 'pay'; render(); scrollTo(0, 0);
}

// ---------- Months ----------
// The savings goal: saved so far, and whether that's on track for the plan.
function goalCard() {
  const plan = getPlan(), box = $('mGoal');
  if (!plan) { box.innerHTML = '<button class="goal setup" id="mPlan"><b>Set a savings plan</b><span class="label">Your salary, what to save each month, and your goal</span></button>'; return; }
  const now = monthIdx(today()), by = savedByMonth(), months = Math.ceil(plan.goal / plan.save), end = plan.start + months - 1;
  let total = 0;
  by.forEach((v, m) => { if (m >= plan.start && m <= now) total += v; });
  total = Math.max(0, total);
  const done = Math.min(months, Math.max(0, now - plan.start)), expected = plan.save * done, thisMonth = Math.max(0, by.get(now) || 0);
  let status, bad = false;
  if (total >= plan.goal) status = '<b>Goal reached</b>';
  else if (now < plan.start) status = `Starts in ${monthName(Math.floor(plan.start / 12), plan.start % 12)}`;
  else if (now > end) { bad = true; status = `<b>${whole(plan.goal - total)} short</b> of the goal`; }
  else if (total + 1 >= expected) status = `<b>On track</b> · month ${now - plan.start + 1} of ${months} · ` + (thisMonth >= plan.save - 1 ? 'this month done' : `move ${whole(plan.save - thisMonth)} after your salary on the ${ordinal(plan.day || 27)}`);
  else { bad = true; status = `<b>Behind by ${whole(expected - total)}</b> · save ${whole((plan.goal - total) / (months - done))} a month to finish on time`; }
  const pct = Math.min(100, total / plan.goal * 100);
  box.innerHTML = `<div class="goal"><div class="gt"><span class="label">Savings goal · by ${monthName(Math.floor(end / 12), end % 12)}</span><button class="link" id="mPlan">Edit</button></div>` +
    `<div class="gv">${whole(total)}<small> of ${whole(plan.goal)}</small></div><div class="meter" role="img" aria-label="${Math.round(pct)}% of the goal saved"><i style="width:${pct.toFixed(1)}%"></i></div><div class="gs${bad ? ' bad' : ''}">${status}</div></div>`;
}

function renderMonths() {
  goalCard();
  const t = today(), now = monthIdx(t), sums = new Map();
  data.forEach(p => { const v = spend(p); if (v) sums.set(monthIdx(p._d), (sums.get(monthIdx(p._d)) || 0) + v); });
  const list = [];
  for (let m = now; m >= firstMonth() && list.length < 12; m--) list.push({m, v: sums.get(m) || 0, part: m !== now && partial(m)});
  const full = list.filter(e => e.m < now && !e.part).slice(0, 3);
  $('mUsual').textContent = full.length ? `Usual month: ${whole(full.reduce((s, e) => s + e.v, 0) / full.length)} SAR` : '';
  const max = Math.max(...list.map(e => e.v), 1);
  $('mBars').innerHTML = list.map(e => {
    const y = Math.floor(e.m / 12), mo = e.m % 12, tag = e.m === now ? 'so far' : e.part ? 'partial' : '';
    return `<button class="row" data-m="${e.m}"><span class="m">${monthName(y, mo)}${tag ? ` <span class="s">${tag}</span>` : ''}</span><span class="a">${whole(e.v)}</span>${icon('next')}<span class="t"><i${e.m === now ? ' class="soft"' : ''} style="width:${(e.v / max * 100).toFixed(1)}%"></i></span></button>`;
  }).join('');

  const fixed = fixedCosts();
  const changes = subsChanges(), subs = fixed.filter(f => f.p.category === 'Subscriptions');
  $('mFixedSum').textContent = fixed.length ? `About ${whole(fixed.reduce((s, f) => s + f.p.amount, 0))} SAR a month` + (subs.length ? ` · subscriptions ${whole(subs.reduce((s, f) => s + f.p.amount, 0) * 12)} a year` : '') : 'Nothing repeats every month yet';
  $('mFixed').innerHTML = fixed.map(f => {
    const c = changes.find(x => !x.isNew && x.was === f.p.amount && nameKey(x.p.merchant) === nameKey(f.p.merchant));
    return `<button class="tx" data-q="${esc(f.p.merchant)}"><span class="m">${esc(label(f.p))}</span><span class="a">${amt(c ? c.p.amount : f.p.amount)}</span><span class="s">Around the ${ordinal(f.day)}${c ? ` · was ${amt(f.p.amount)}` : ''}</span></button>`;
  }).join('');
  renderHabits();
  balChart();
}

function balChart() {
  const pts = data.filter(p => p.balance != null).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
  $('mBalW').hidden = pts.length < 2;
  if (pts.length < 2) return;
  const lastD = pts[pts.length - 1]._d;
  $('mBalD').textContent = `From bank statements, the latest on ${shortDate(lastD)}${lastD.getUTCFullYear() !== today().getUTCFullYear() ? ' ' + lastD.getUTCFullYear() : ''}` + (dayNum(today()) - dayNum(lastD) > 35 ? '. Import a newer one to bring it up to date.' : '');
  const box = $('mBal'), W = Math.max(box.clientWidth, 280), H = 150, T = 16, B = 24, R = 58;
  const vals = pts.map(p => Number(p.balance)), top = niceMax(Math.max(...vals, 1));
  const X = i => i / (pts.length - 1) * (W - R), Y = v => T + (H - T - B) * (1 - Math.max(v, 0) / top);
  const line = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balance from statements, latest ${whole(vals[vals.length - 1])}">`;
  s += `<line x1="0" x2="${W - R}" y1="${Y(top)}" y2="${Y(top)}" stroke="var(--grid)"/><text x="0" y="${Y(top) - 5}">${whole(top)}</text>`;
  s += `<line x1="0" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--axis)"/>`;
  s += `<path d="${line}V${Y(0)}H0Z" fill="var(--acc)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<text x="0" y="${H - 5}">${shortDate(pts[0]._d)}</text><text x="${W - R}" y="${H - 5}" text-anchor="end">${shortDate(lastD)}</text>`;
  s += `<text class="e1" x="${X(pts.length - 1) + 6}" y="${Y(vals[vals.length - 1]) + 4}">${whole(vals[vals.length - 1])}</text>`;
  s += `<line id="bx" y1="${T}" y2="${H - B}" stroke="var(--axis)" visibility="hidden"/></svg>`;
  box.innerHTML = s;
  const svg = box.querySelector('svg'), bx = svg.querySelector('#bx');
  svg.onpointermove = svg.onpointerdown = ev => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(pts.length - 1, Math.round((ev.clientX - r.left) / r.width * W / (W - R) * (pts.length - 1))));
    bx.setAttribute('x1', X(i)); bx.setAttribute('x2', X(i)); bx.setAttribute('visibility', 'visible');
    showTip(ev, [whole(vals[i]) + ' SAR', shortDate(pts[i]._d)]);
  };
  svg.onpointerleave = () => { bx.setAttribute('visibility', 'hidden'); hideTip(); };
}

// ---------- tooltip ----------
function showTip(ev, lines) {
  const t = $('tt'); t.textContent = '';
  lines.forEach((s, i) => { const e = document.createElement(i ? 'div' : 'b'); e.textContent = s; t.append(e); });
  t.style.display = 'block';
  t.style.left = Math.max(8, Math.min(ev.clientX + 12, innerWidth - t.offsetWidth - 8)) + 'px';
  t.style.top = Math.max(ev.clientY - t.offsetHeight - 14, 8) + 'px';
}
const hideTip = () => { $('tt').style.display = 'none'; };

// ---------- edit sheet ----------
function opts(el, list) { el.innerHTML = list.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); }
function edit(p) {
  if (!p) return;
  cur = p;
  const inc = INCOMING.includes(p.kind), out = p.kind === 'transfer_out';
  $('dM').textContent = p.merchant || 'Unknown';
  $('dS').textContent = `${inc ? '+' : ''}${money(p.amount)} SAR · ${DAY(p._d.getUTCDay())} ${shortDate(p._d)} ${p._d.getUTCFullYear()}, ${hhmm(p._d)}${p.city ? ' · ' + cityName(p.city) : ''}`;
  opts($('dCat'), [...allCats().map(c => [c, c]), ['__new', 'New category...']]);
  $('dCat').value = p.category; $('dNewW').hidden = true; $('dNew').value = '';
  const n = data.filter(x => sameMerchantAs(x, p)).length;
  $('dAllW').hidden = !p.merchant || INCOMING_KINDS.includes(p.kind);
  $('dAll').checked = false;
  $('dAllT').textContent = out ? (n > 1 ? `Use for all ${n} transfers with this person, and future ones` : 'Use for future transfers to this person') : (n > 1 ? `Use for all ${n} payments from this merchant, and future ones` : 'Use for future payments from this merchant');
  $('dNote').value = p.note || ''; $('dEx').checked = !!p.excluded; $('dErr').textContent = '';
  hint();
  hideTip();
  $('dlg').showModal();
}
function hint() {
  const c = $('dCat').value, t = !(cur && cur.kind === 'transfer_out') ? '' : c === 'Transfers' ? "Transfers don't count as spending. Pick a category, like Rent & Housing, to count it, or Savings for money you put aside." : c === 'Savings' ? 'Savings never count as spending. They count toward your savings goal.' : '';
  $('dHint').hidden = !t; $('dHint').textContent = t;
}
$('dCat').onchange = () => { $('dNewW').hidden = $('dCat').value !== '__new'; hint(); };
$('dCancel').onclick = () => $('dlg').close();
const closeOutside = d => d.addEventListener('click', e => { const r = d.getBoundingClientRect(); if (e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) d.close(); });
closeOutside($('dlg')); closeOutside($('planDlg'));
$('dSave').onclick = async () => {
  const category = $('dCat').value === '__new' ? $('dNew').value.trim() : $('dCat').value;
  if (!category) { $('dErr').textContent = 'Type a category name'; return; }
  const all = $('dAll').checked && !$('dAllW').hidden;
  const body = {category, note: $('dNote').value.trim() || null, excluded: $('dEx').checked, apply_to_merchant: all};
  $('dSave').disabled = true;
  const r = await fetch(`${API}?id=${encodeURIComponent(cur.id)}`, {method: 'PATCH', headers: {...headers(), 'Content-Type': 'application/json'}, body: JSON.stringify(body)}).catch(() => null);
  $('dSave').disabled = false;
  if (!r || !r.ok) { $('dErr').textContent = 'Could not save. Check your connection.'; return; }
  if (all) data.filter(x => sameMerchantAs(x, cur)).forEach(x => { x.category = category; });
  Object.assign(cur, {category, note: body.note, excluded: body.excluded});
  changed(); $('dlg').close(); render();
};
$('dDel').onclick = async () => {
  if (!confirm('Delete this payment for good?')) return;
  const r = await fetch(`${API}?id=${encodeURIComponent(cur.id)}`, {method: 'DELETE', headers: headers()}).catch(() => null);
  if (!r || !r.ok) { $('dErr').textContent = 'Could not delete. Check your connection.'; return; }
  data = data.filter(x => x !== cur);
  changed(); $('dlg').close(); render();
};

// ---------- wiring ----------
$('hPrev').innerHTML = icon('prev'); $('hNext').innerHTML = icon('next');
const moveMonth = k => { const m = vy * 12 + vm + k; vy = Math.floor(m / 12); vm = m % 12; showAllCats = false; renderHome(); };
$('hPrev').onclick = () => moveMonth(-1);
$('hNext').onclick = () => moveMonth(1);
$('hCats').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.other) { showAllCats = true; renderHome(); } else openPayments({cat: b.dataset.cat, y: vy, m: vm}); };
$('hList').onclick = e => { const b = e.target.closest('button'); if (b) edit(byId(b.dataset.id)); };
$('hAll').onclick = () => openPayments({y: vy, m: vm});
$('pList').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pair) { const ok = dupOk(); ok.add(b.dataset.pair); try { localStorage.setItem(DUP_KEY, JSON.stringify([...ok])); } catch (er) {} renderPay(); return; }
  edit(byId(b.dataset.id));
};
$('pReview').onclick = () => openReview();
$('pExport').onclick = () => exportCsv();
$('hNote').onclick = () => { if ($('hNote').dataset.go === 'review') openReview(); };
$('hNote').onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && $('hNote').dataset.go === 'review') { e.preventDefault(); openReview(); } };
$('mHabits').onclick = e => { const b = e.target.closest('button'); if (b) openPayments(null, b.dataset.q); };
$('pChip').onclick = e => { if (e.target.closest('button')) { pFilter = null; shown = 60; renderPay(); } };
$('pMore').onclick = () => { shown += 60; renderPay(); };
$('q').oninput = () => { if (pFilter && pFilter.review) pFilter = null; shown = 60; renderPay(); };
$('mBars').onclick = e => { const b = e.target.closest('button'); if (!b) return; const m = +b.dataset.m; vy = Math.floor(m / 12); vm = m % 12; showAllCats = false; tab = 'home'; render(); scrollTo(0, 0); };
$('mFixed').onclick = e => { const b = e.target.closest('button'); if (b) openPayments(null, b.dataset.q); };
$('mGoal').onclick = e => { if (e.target.closest('#mPlan')) openPlan(); };

// ---------- savings plan sheet ----------
const num = v => parseFloat(String(v).replace(/[,\s]/g, ''));
function openPlan() {
  const now = monthIdx(today()), p = getPlan() || {income: '', day: 27, save: '', goal: '', start: now}, list = [];
  for (let m = Math.min(p.start, now - 3); m <= now + 2; m++) list.push([m, monthName(Math.floor(m / 12), m % 12)]);
  $('pIncome').value = p.income; $('pDay').value = p.day; $('pAmt').value = p.save; $('pGoal').value = p.goal;
  opts($('pStart'), list); $('pStart').value = String(p.start);
  $('pDel').hidden = !getPlan(); $('pErr').textContent = '';
  $('planDlg').showModal();
}
$('pOk').onclick = () => {
  const p = {income: num($('pIncome').value), day: Math.round(num($('pDay').value)) || 27, save: num($('pAmt').value), goal: num($('pGoal').value), start: +$('pStart').value};
  const err = !(p.income > 0 && p.save > 0 && p.goal > 0) ? 'Fill in the salary, the monthly saving and the goal' : p.save >= p.income ? 'The monthly saving must be less than the salary' : p.day < 1 || p.day > 31 ? 'Salary day is a day of the month, 1 to 31' : '';
  if (err) { $('pErr').textContent = err; return; }
  try { localStorage.setItem(PLAN_KEY, JSON.stringify(p)); } catch (e) { $('pErr').textContent = 'Could not save on this phone'; return; }
  $('planDlg').close(); render();
};
$('pDel').onclick = () => { if (!confirm('Remove your savings plan?')) return; try { localStorage.removeItem(PLAN_KEY); } catch (e) {} $('planDlg').close(); render(); };
$('pCancel').onclick = () => $('planDlg').close();
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.tab === tab) return scrollTo({top: 0, behavior: 'smooth'}); tab = b.dataset.tab; render(); scrollTo(0, 0); };
$('go').onclick = () => { localStorage.setItem('tok', $('tok').value.trim()); $('err').textContent = ''; load(); };
$('tok').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
addEventListener('resize', () => { if (!$('app').hidden) render(); });
addEventListener('scroll', hideTip, {passive: true});
// The Home Screen app is often resumed, not reopened: fetch new payments when it comes back.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && loadedAt && Date.now() - loadedAt > 60e3 && !$('dlg').open) load(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
